<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>תוכן לימודי — בדיקת טעינה</title>
    <style>
      body { margin: 0; padding: 20px 28px; background: #f3f4f6; color: #111; font-family: Rubik, Arial, Helvetica, sans-serif; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      h2 { font-size: 17px; margin: 24px 0 8px; border-bottom: 2px solid #d1d5db; padding-bottom: 4px; }
      .tiles { display: flex; gap: 12px; flex-wrap: wrap; }
      .tile { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 16px; min-width: 130px; }
      .tile b { display: block; font-size: 26px; }
      .tile span { color: #6b7280; font-size: 13px; }
      table { border-collapse: collapse; background: #fff; width: 100%; font-size: 13px; }
      th, td { border: 1px solid #e5e7eb; padding: 4px 8px; text-align: right; vertical-align: top; }
      th { background: #f9fafb; }
      .signs { display: flex; flex-wrap: wrap; gap: 6px; }
      .signs img { width: 56px; height: 56px; background: #fff; border-radius: 6px; border: 1px solid #e5e7eb; }
      .ok { color: #15803d; } .bad { color: #b91c1c; }
      pre { background: #fff; border: 1px solid #e5e7eb; padding: 8px; direction: ltr; text-align: left; font-size: 12px; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="root">טוען תוכן…</div>
    <script type="module" src="/src/dev/content.ts"></script>
  </body>
</html>
