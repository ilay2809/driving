<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>רכב השחקן — מעבדת פיתוח</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #f2f5f8; font-family: 'Rubik', 'Heebo', system-ui, sans-serif; overflow: hidden; }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #overlay { position: fixed; top: 12px; left: 12px; direction: ltr; text-align: left; background: rgba(12, 18, 26, 0.82); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.5; min-width: 230px; pointer-events: none; font-variant-numeric: tabular-nums; }
      #overlay b { color: #9aa7b4; font-weight: 500; display: inline-block; width: 92px; }
      #help { position: fixed; bottom: 12px; right: 12px; background: rgba(12, 18, 26, 0.82); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 14px; font-size: 12px; line-height: 1.6; color: #c9d1d9; pointer-events: none; max-width: 420px; }
      #help kbd { background: #1f2630; border-radius: 4px; padding: 0 5px; font-family: inherit; color: #fff; }
      #boot { position: fixed; inset: 0; display: grid; place-content: center; font-size: 20px; color: #9aa7b4; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay"></div>
    <div id="help"></div>
    <div id="boot">טוען פיזיקה…</div>
    <script type="module" src="/src/dev/vehicle.ts"></script>
  </body>
</html>
