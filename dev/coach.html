<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>מודול המאמן — הרצת בדיקה</title>
    <style>
      :root {
        --bg: #101418;
        --panel: #1a2026;
        --line: #2b343d;
        --text: #e8edf2;
        --muted: #93a1ad;
        --accent: #4aa3ff;
        --warn: #ffb347;
        --danger: #ff5a5a;
        --ok: #5ad37a;
        font-family: 'Heebo', 'DejaVu Sans', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 420px;
        grid-template-rows: 1fr;
      }
      #map-wrap {
        position: relative;
        border-left: 1px solid var(--line);
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #subtitle {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 80%;
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 22px;
        font-size: 24px;
        line-height: 1.35;
        text-align: center;
        direction: rtl;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #subtitle.visible {
        opacity: 1;
      }
      #subtitle .who {
        display: block;
        font-size: 13px;
        color: var(--accent);
        letter-spacing: 0.02em;
        margin-bottom: 4px;
      }
      #subtitle.examiner .who {
        color: var(--warn);
      }
      #hud {
        position: absolute;
        top: 14px;
        right: 14px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        min-width: 240px;
        direction: rtl;
      }
      #hud .kind {
        font-size: 30px;
        line-height: 1;
      }
      #hud .text {
        font-size: 18px;
        font-weight: 700;
      }
      #hud .dist {
        color: var(--muted);
        font-size: 14px;
      }
      #speed {
        position: absolute;
        bottom: 28px;
        right: 14px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 28px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #speed small {
        font-size: 12px;
        color: var(--muted);
        font-weight: 400;
      }
      #intervention {
        position: absolute;
        top: 14px;
        left: 14px;
        background: var(--danger);
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 700;
        display: none;
      }
      #intervention.visible {
        display: block;
      }
      #panel {
        padding: 14px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        direction: rtl;
      }
      h1 {
        font-size: 17px;
        margin: 0;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 6px;
        color: var(--muted);
        font-weight: 500;
        text-transform: uppercase;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      button {
        background: #243040;
        color: var(--text);
        border: 1px solid #3a4a5c;
        border-radius: 8px;
        padding: 6px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        background: #2e3d50;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #06111c;
        font-weight: 700;
      }
      select,
      input[type='range'] {
        font: inherit;
      }
      label {
        font-size: 13px;
        color: var(--muted);
      }
      #queue li,
      #log li {
        font-size: 13px;
        padding: 3px 0;
        border-bottom: 1px dashed var(--line);
        list-style: none;
      }
      #queue,
      #log {
        margin: 0;
        padding: 0;
      }
      #log {
        max-height: 260px;
        overflow: auto;
        font-variant-numeric: tabular-nums;
      }
      .p3 {
        color: var(--danger);
      }
      .p2 {
        color: var(--warn);
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 6px;
        background: #243040;
        color: var(--muted);
        margin-left: 6px;
      }
      #stats {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="map-wrap">
      <canvas id="map"></canvas>
      <div id="hud"><div class="kind">⬆</div><div class="text">—</div><div class="dist"></div></div>
      <div id="intervention">אני בולם!</div>
      <div id="speed">0 <small>קמ"ש</small></div>
      <div id="subtitle"><span class="who"></span><span class="text"></span></div>
    </div>
    <div id="panel">
      <h1>מודול המאמן — מגרש האימונים</h1>
      <div class="card">
        <h2>מצב</h2>
        <div class="row">
          <select id="mode">
            <option value="instructor">מורה נהיגה (נהיגה חופשית)</option>
            <option value="examiner">בוחן (טסט)</option>
          </select>
          <button id="btn-run" class="primary">▶ הפעל</button>
          <button id="btn-reset">איפוס</button>
          <label><input type="checkbox" id="tts" /> קול (TTS)</label>
        </div>
        <div class="row" style="margin-top: 8px">
          <label for="speed-range">מהירות יעד</label>
          <input id="speed-range" type="range" min="0" max="70" value="40" />
          <span id="speed-value">40 קמ"ש</span>
        </div>
      </div>
      <div class="card">
        <h2>פעולות</h2>
        <div class="row">
          <button id="btn-repeat">🔁 חזור על ההוראה</button>
          <button id="btn-explain">❓ מה קורה כאן?</button>
          <button id="btn-stop">⏹ עצור 4 שניות</button>
          <button id="btn-reverse">◀ רוורס 15 מ'</button>
        </div>
        <div class="row" style="margin-top: 6px">
          <button id="btn-speeding">עבירה: מהירות</button>
          <button id="btn-good">עצירה טובה</button>
          <button id="btn-ped">הולך רגל במעבר</button>
          <button id="btn-red">אדום ב-n11</button>
          <button id="btn-car">רכב עצור לפנינו</button>
        </div>
        <div class="row" style="margin-top: 6px">
          <button id="btn-say0">אמור p0</button>
          <button id="btn-say1">אמור p1</button>
          <button id="btn-say2">אמור p2</button>
          <button id="btn-say3">אמור p3 (קוטע)</button>
        </div>
      </div>
      <div class="card">
        <h2>תור הדיבור</h2>
        <ul id="queue"></ul>
      </div>
      <div class="card">
        <h2>נתונים</h2>
        <div id="stats"></div>
      </div>
      <div class="card">
        <h2>אירועים</h2>
        <ul id="log"></ul>
      </div>
    </div>
    <script type="module" src="/src/dev/coach.ts"></script>
  </body>
</html>
